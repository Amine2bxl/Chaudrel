<!doctype html>
<html lang="fr">

    <meta name="theme-color" content="#F4F1EA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Les balises ci-dessous sont remplacées par route au build (scripts/prerender.js) -->
    <title>Chaudrel - Rénovation à Bruxelles | Devis gratuit</title>
    <meta
      name="description"
      content="Chaudrel, entreprise de rénovation à Bruxelles active dans toute la Belgique : rénovation complète, façade, toiture, finitions intérieures, aménagement extérieur. Devis gratuit et sans engagement."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <link rel="canonical" href="https://chaudrel.be/" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable summary" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:site_name" content="Chaudrel Rénovation" />
    <meta property="og:title" content="Chaudrel - Rénovation à Bruxelles" />
    <meta property="og:description" content="Rénovation complète, façade, toiture, finitions et extérieurs, partout en Belgique. Devis gratuit." />

    <meta property="og:image" content="https://chaudrel.be/og-image.jpg" />

    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Chaudrel - Rénovation à Bruxelles" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-italic-latin.woff2" crossorigin />

    <!-- Les apparitions au défilement ne cachent rien quand JavaScript est absent.
         Script autorisé par son empreinte dans la CSP (vercel.json). -->
    <script>document.documentElement.classList.add('js')</script>
