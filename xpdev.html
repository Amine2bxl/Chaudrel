<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#F7F5F2}canvas{width:100vw;height:100vh;display:block}body.dusk{background:#1c1c1c}</style></head>
<body><canvas id="c"></canvas><script type="module">
import { createEngine } from '/src/components/experience/scene/engine.js';
import { keyframes, stateAt } from '/src/components/experience/scene/storyboard.js';
const q = new URLSearchParams(location.search);
const e = createEngine(document.getElementById('c'));
const a = innerWidth/innerHeight;
e.resize(innerWidth, innerHeight, 1);
window.go = (p) => { const s = stateAt(keyframes(a), p); document.body.classList.toggle('dusk', s.dusk>0.5); e.apply(s); return e.info(); };
window.go(+(q.get('p')||0)); window.ready = true;
</script></body></html>
